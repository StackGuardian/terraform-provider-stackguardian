name: "Terraform Provider on production API"  # layer 3: acceptance tests

# Runs on pull requests targeting main, i.e. when work is promoted out of develop.
# These tests create real resources against the StackGuardian API, so unlike the
# compatibility gate (.github/workflows/compat.yaml) they need credentials and
# cannot run on forks.
#
# The compatibility gate (.github/workflows/compat.yaml) proves the provider's
# schema loads on every supported Terraform version. This workflow runs the full
# acceptance suite against the real API on the minimum and maximum versions only,
# bounding the behavioural range without the 12× cost of testing every minor.

on:
  pull_request:
    branches:
      - "main"
    types: [ opened, reopened, synchronize ]
  workflow_dispatch:
  workflow_call:

# The acceptance tests share one StackGuardian organization and several of them
# use fixed resource names, so two runs must never overlap. Without this, two
# pull requests racing each other produce collisions that look like version
# incompatibilities.
concurrency:
  group: "acceptance-tests"
  cancel-in-progress: false

jobs:

  provider-project_test:
    name: "Test Provider project"
    runs-on: ubuntu-latest
    strategy:
      # Sequential: the tests share one organization, and a failure on one
      # version should not hide the result on the other.
      fail-fast: false
      max-parallel: 1
      matrix:
        terraform:
          - "1.5.7"
          - "1.16.4"
    env:
      GOPRIVATE: github.com/StackGuardian/sg-sdk-go
    steps:

      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Install Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: "Build Provider"
        run: make build

      # docs-validate-examples shells out to `terraform init` and `terraform
      # validate`, so the CLI must be on PATH before the docs check runs.
      - name: "Install Terraform ${{ matrix.terraform }}"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
          terraform_version: "${{ matrix.terraform }}"

      # Runs before the acceptance tests on purpose. These checks need no
      # credentials and no network, and they finish in a couple of minutes. Behind
      # test-acc they were skipped outright whenever the production API was
      # unavailable, a secret was unavailable to the PR, or an unrelated
      # acceptance test failed -- a job stops at its first failing step.
      - name: "Check Provider docs"
        run: |
          set -eu -x;
          make tools-install;
          make docs-validate;
          make docs-validate-examples;
          make docs-check;
        shell: bash

      # TF_ACC_TERRAFORM_VERSION makes terraform-plugin-testing download and use
      # exactly this CLI, so the matrix is the single authority on which version
      # is under test. The CLI installed above is the same version, which keeps
      # the matrix authoritative.
      - name: "Test Provider with acceptance tests (Terraform ${{ matrix.terraform }})"
        run: make test-acc
        env:
          TF_ACC_TERRAFORM_VERSION: "${{ matrix.terraform }}"
          STACKGUARDIAN_API_URI: "${{ secrets.SG_PRD_API_URI }}"
          STACKGUARDIAN_API_KEY: "${{ secrets.SG_PRD_API_KEY }}"
          STACKGUARDIAN_ORG_NAME: "${{ secrets.SG_PRD_ORG_NAME }}"
          TEST_AZURE_STORAGE_BACKEND_ACCESS_KEY: "${{ secrets.TEST_AZURE_STORAGE_BACKEND_ACCESS_KEY }}"
