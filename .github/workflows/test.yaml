name: "Test TF-Provider on API-PROD"  # layer 3: acceptance tests across the supported Terraform range

# Runs on pull requests targeting main, i.e. when work is promoted out of develop.
# These tests create real resources against the StackGuardian API, so unlike the
# compatibility gate (.github/workflows/compat.yaml) they need credentials and
# cannot run on forks.
#
# The matrix proves the provider actually works on every Terraform version we
# claim to support, not merely that its schema decodes there.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "main"
    types: [ opened, edited, reopened, synchronize, ready_for_review ]
  workflow_dispatch:
  workflow_call:

# The acceptance tests share one StackGuardian organization and several of them
# use fixed resource names, so two runs must never overlap. Without this, two
# pull requests racing each other produce collisions that look like version
# incompatibilities.
concurrency:
  group: "acceptance-tests"
  cancel-in-progress: false

jobs:

  provider-project_test:
    name: "Test Provider project (Terraform ${{ matrix.terraform }})"
    runs-on: ubuntu-latest
    strategy:
      # Sequential and non-cancelling: the tests share one organization, and a
      # failure on one version should not hide the result on the others.
      fail-fast: false
      max-parallel: 1
      matrix:
        # The support floor, the newest tested release, and the latest patch of
        # every minor series in between. Kept in sync with
        # constants.SupportedTerraformVersions by
        # TestTerraformMatrixMatchesWorkflows.
        terraform:
          - "1.5.7"  # MinTerraformVersion: the support floor
          - "1.6.6"
          - "1.7.5"
          - "1.8.5"
          - "1.9.8"
          - "1.10.5"
          - "1.11.4"
          - "1.12.2"
          - "1.13.5"
          - "1.14.9"
          - "1.15.9"
          - "1.16.2"  # MaxTerraformVersion: the newest tested release
    env:
      GOPRIVATE: github.com/StackGuardian/sg-sdk-go
    steps:

      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Install Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: "Build Provider"
        run: make build

      # TF_ACC_TERRAFORM_VERSION makes terraform-plugin-testing download and use
      # exactly this CLI, so the matrix is the single authority on which version
      # is under test. Nothing else installs Terraform in this job, which rules
      # out a stray binary on PATH silently taking over.
      - name: "Test Provider with acceptance tests"
        run: make test-acc
        env:
          TF_ACC_TERRAFORM_VERSION: "${{ matrix.terraform }}"
          STACKGUARDIAN_API_URI: "${{ secrets.SG_PRD_API_URI }}"
          STACKGUARDIAN_API_KEY: "${{ secrets.SG_PRD_API_KEY }}"
          STACKGUARDIAN_ORG_NAME: "${{ secrets.SG_PRD_ORG_NAME }}"
          TEST_AZURE_STORAGE_BACKEND_ACCESS_KEY: "${{ secrets.TEST_AZURE_STORAGE_BACKEND_ACCESS_KEY }}"

  provider-docs_check:
    name: "Check Provider docs"
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/StackGuardian/sg-sdk-go
    steps:

      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Install Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: "Check Provider docs"
        run: |
          set -eu -x;
          make tools-install;
          make docs-validate;
        shell: bash
