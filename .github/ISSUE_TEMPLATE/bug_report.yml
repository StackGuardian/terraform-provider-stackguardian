name: 🐛 Bug report
description: The provider does something other than what it should.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the
        [Troubleshooting guide](https://registry.terraform.io/providers/StackGuardian/stackguardian/latest/docs/guides/Troubleshooting)
        first — it covers several errors that look like provider bugs but are configuration issues.

  - type: input
    id: provider_version
    attributes:
      label: Provider version
      placeholder: "1.12.0"
    validations:
      required: true

  - type: input
    id: terraform_version
    attributes:
      label: Terraform / OpenTofu version
      description: Output of `terraform version`.
      placeholder: "Terraform v1.14.0 on darwin_arm64"
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Which API region?
      description: A key issued in one region does not work against the other.
      options:
        - https://api.app.stackguardian.io (EU)
        - https://api.us.stackguardian.io (US)
        - Other / self-hosted
    validations:
      required: true

  - type: input
    id: resources
    attributes:
      label: Affected resources or data sources
      placeholder: stackguardian_policy, stackguardian_workflow_group
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Terraform configuration
      description: |
        The smallest configuration that reproduces the problem. Please remove API keys,
        org names, account IDs and any other credentials.
      render: terraform
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include the full error message.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Debug output (optional)
      description: |
        Output of `TF_LOG=DEBUG terraform apply`. Please scrub credentials — debug logs
        contain request headers.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have removed all credentials and org-identifying values from the above.
          required: true
