version: 2

# https://goreleaser.com

project_name: terraform-provider-stackguardian

#  env_files:
#    github_token: '{{ .Env.SG_GITHUB_KEY_FILEPATH }}'

#  before:
#    hooks:
#      # This is just an example and not a requirement for provider building/publishing
#      # Is it really required?
#      - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
      - GOPRIVATE='github.com/StackGuardian/terraform-provider-stackguardian'
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - '-trimpath'
      - '-v'
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    goos:
      - darwin
      - freebsd
      - linux
      - windows
    goarch:
      - '386'
      - amd64
      - arm
      - arm64
    ignore:
      # Go no longer supports these GOOS/GOARCH combinations.
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [ 'zip' ]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  name_template: 'v{{.Version}}'
  github:
    #owner: stackguardian
    #owner: '{{ .Env.GITHUB_REPOSITORY_OWNER }}'
    owner: '{{ if index .Env "GITHUB_REPOSITORY_OWNER" }}{{ .Env.GITHUB_REPOSITORY_OWNER }}{{ else }}stackguardian{{ end }}'
    name: terraform-provider-stackguardian
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # The release is created as a draft here and is published only after the
  # verification step in .github/workflows/release.yaml has checked every
  # artifact. This keeps the Terraform Registry webhook from firing against a
  # release that has no assets attached yet.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  # `replace` (not `append`) makes re-runs idempotent: an asset that already
  # exists is deleted and re-uploaded rather than failing with
  # `422 Validation Failed [already_exists]`, which is unrecoverable.
  mode: replace
  skip_upload: false

# Release notes are generated by GitHub itself (the same "What's Changed" +
# "Full Changelog" body that the Generate release notes button produces).
# Before the release was created by this pipeline a maintainer clicked that
# button by hand; github-native keeps the body identical now that GoReleaser
# creates the release.
changelog:
  use: github-native
